services:
  mysql:
    ports: !override
      - "3306:3306"

  simulador:
    ports:
      - "9000:9000"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    ports: !override
      - "3000:3000"
    volumes:
      - ./apps/backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      VITE_API_URL: /api
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "5173:5173"

  nginx:
    ports: !override
      - "8080:8080"
    volumes: !override
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_node_modules:
  frontend_node_modules:
